<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GreenDreamBerlin</title>
    <link rel="stylesheet" href="css/stylesheet.css">
    <script src="js/script.js" defer></script>
</head>
<body>
<header>
    <h1 id="greeting">Willkommen zu GreenDreamBerlin</h1>
</header>
<div id="screen1" class="screen1">
    <h1>Login Form</h1>
    <form action="">
        <h3>GreenDreamBerlin</h3>
        <label for="usernameId"><b>Username</b></label>
        <input type="text" id="usernameId" name="username" placeholder="Enter username" required>
        <br>
        <label for="password"><b>Password</b></label>
        <input type="text" id="password" name="password" placeholder="Enter password" required>
        <button type="submit">Login</button>

    </form>
</div>

<div id="screen2" class="screen2">
    <h2>Locations:</h2>
    <div id="locationsContainer"></div>
    <button id="addButton" class="add-button">Add</button>
    <button id="logoutButton" class="logout-button">Logout</button>
</div>

<div id="screen3" class="screen3">
    <h3>Add locations</h3>
    <form>
        <div class="eingabefelder">
            <label for="name" class="form-label">Name/Title *</label>
            <input type="text" class="form-control" id="name" placeholder="Provide a title" required>
        </div>
        <div class="eingabefelder">
            <label for="description" class="form-label">Description *</label>
            <textarea class="form-control" id="description" placeholder="Provide a description" required></textarea>
        </div>
        <div class="eingabefelder">
            <label for="street" class="form-label">Street & House No. *</label>
            <input type="text" class="form-control" id="street" placeholder="Provide an address" required>
        </div>
        <div class="eingabefelder">
            <label for="zip" class="form-label">ZIP *</label>
            <input type="text" class="form-control" id="zip" placeholder="Provide ZIP" required>
        </div>
        <div class="eingabefelder">
            <label for="city" class="form-label">City *</label>
            <input type="text" class="form-control" id="city" placeholder="Provide a city" required>
        </div>
        <div class="eingabefelder">
            <label for="category" class="form-label">Category *</label>
            <select class="form-select" id="category" required>
                <option value="Bike/Cyclists">Bike/Cyclists</option>
                <option value="Pedestrians">Pedestrians</option>
                <option value="Public transportation">Public transportation</option>
                <option value="Cars/Car-Infrastructure">Cars/Car-Infrastructure</option>
                <option value="Industry">Industry</option>
                <option value="Parks&Rec">Parks & Rec.</option>
            </select>
        </div>
        <div class="eingabefelder">
            <label class="form-label" for="temporary">Temporary</label>
            <input type="checkbox" class="form-control" id="temporary">
        </div>
        <div class="eingabefelder">
            <label for="formFile" class="form-label">Bild hochladen</label>
            <input class="form-control" type="file" id="formFile">
        </div>
        <button id="button-submit" type="submit" class="button-submit">Save/Submit</button>
        <button id="button-cancel" type="button" class="button-cancel">Cancel</button>
    </form>
</div>

<div id="screen4" class="screen4">
    <h3 id="viewEditHeader">Some header</h3>
    <div class="formular-screen4">
        <aside class="image-container">
            <img id="locatonImage" src="" alt="Bild der Baustelle">
        </aside>
        <br>
        <form>
            <div class="eingabefelder">
                <label for="nameUpdate" class="form-label">Name/Title </label>
                <input type="text" class="form-control" id="nameUpdate" value="Baustelle"
                       required>
            </div>
            <div class="eingabefelder">
                <label for="descriptionUpdate" class="form-label">Description *</label>
                <textarea class="form-control" id="descriptionUpdate" required>Die Baustelle auf der Brückenstraße sollte eigentlich schon vor einem halben Jahre fertig sein. Leider sind dort kaum Fortschritte zu sehen. Dies führt du einem Umweg von mindestens 15 Minuten für die meisten Studierenden, die normalerweise von Schöneweide die Tram nehmen.
            </textarea>
            </div>
            <div class="eingabefelder">
                <label for="streetUpdate" class="form-label">Street & House No. *</label>
                <input type="text" class="form-control" id="streetUpdate" value="" required>
            </div>
            <div class="eingabefelder">
                <label for="zipUpdate" class="form-label">ZIP *</label>
                <input type="text" class="form-control" id="zipUpdate" value="" required>
            </div>
            <div class="eingabefelder">
                <label for="cityUpdate" class="form-label">City *</label>
                <input type="text" class="form-control" id="cityUpdate" value="" required>
            </div>
            <div class="eingabefelder">
                <label for="categoryUpdate" class="form-label">Category *</label>
                <select class="form-select" id="categoryUpdate" required>
                    <option value="Bike/Cyclists">Bike/Cyclists</option>
                    <option value="Pedestrians">Pedestrians</option>
                    <option selected="selected">Public transportation</option>
                    <option value="Cars/Car-Infrastructure">Cars/Car-Infrastructure</option>
                    <option value="Industry">Industry</option>
                    <option value="Parks&Rec">Parks & Rec.</option>
                </select>
            </div>
            <div class="eingabefelder">
                <label class="form-label" for="temporaryUpdate">Temporary</label>
                <input type="checkbox" class="form-control" id="temporaryUpdate">
            </div>
            <div class="eingabefelder">
                <label for="formFileUpdate" class="form-label">Bild hochladen</label>
                <input class="form-control" type="file" id="formFileUpdate">
            </div>
            <button id="button-update" type="submit" class="button-update">Update</button>
            <button id="button-delete" type="button" class="button-delete">Delete</button>
            <button id="button-cancel-update-screen" type="button" class="button-cancel">Cancel</button>
        </form>
    </div>
</div>
<footer>
    <a href="#">Impressum</a> |
    <a href="#">Datenschutzerklärung</a>
</footer>
</body>
</html>
