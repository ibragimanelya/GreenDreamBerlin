<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jadelya</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
<div class="screen1">
    <h1>Login Form</h1>
    <form action="">
        <label for="usernameId"><b>Username</b></label>
        <input type="text" id="usernameId" name="username" placeholder="Enter username" required>
        <br>
        <label for="password"><b>Password</b></label>
        <input type="text" id="password" name="password" placeholder="Enter password" required>
        <button type="login">Login</button>
    </form>
</div>
<hr>
<div class="screen2">
    <h1>Willkommen zu Jadelya, Benutzer!</h1>
    <h2>Locations:</h2>

        <div class="gallery">
            <a target="_self" href="Baustelle_Horiz.jpg">
                <img src="Baustelle_Horiz.jpg" alt="Baustelle auf der Brückenstraße">
            </a>
            <div class="desc">Baustelle auf der Brückenstraße</div>
        </div>

        <div class="gallery">
            <a target="_self" href="Industrie_Horiz.jpg">
                <img src="Industrie_Horiz.jpg" alt="Industriegebiet nahe der HTW Berlin">
            </a>
            <div class="desc">Industriegebiet nahe der HTW Berlin</div>
        </div>

        <div class="gallery">
            <a target="_self" href="Elektro_Horiz.jpg">
                <img src="Elektro_Horiz.jpg" alt="Ladesäule für Elektroautos">
            </a>
            <div class="desc">Ladesäule für Elektroautos</div>
        </div>

    <div class="clearfix"></div>

    <button class="add-button">Add</button>
    <button class="logout-button">Logout</button>

    <footer>
        <a href="#">Impressum</a> |
        <a href="#">Datenschutzerklärung</a>
    </footer>
</div>
<hr>
<div class="screen3">
    <h3>Hier können Sie Ihren Standort einfügen</h3>
    <form>
        <div class="eingabefelder">
            <label for="name" class="form-label">Name/Title </label>
            <input type="text" class="form-control" id="name" required>
        </div>
        <div class="eingabefelder">
            <label for="description" class="form-label">Description *</label>
            <textarea class="form-control" id="description" required></textarea>
        </div>
        <div class="eingabefelder">
            <label for="street" class="form-label">Street & House No. *</label>
            <input type="text" class="form-control" id="street" required>
        </div>
        <div class="eingabefelder">
            <label for="zip" class="form-label">ZIP *</label>
            <input type="text" class="form-control" id="zip" required>
        </div>
        <div class="eingabefelder">
            <label for="city" class="form-label">City *</label>
            <input type="text" class="form-control" id="city" required>
        </div>
        <div class="eingabefelder">
            <label for="category" class="form-label">Category *</label>
            <select class="form-select" id="category" required>
                <option value="Bike/Cyclists">Bike/Cyclists</option>
                <option value="Pedestrians">Pedestrians</option>
                <option value="Public transportation">Public transportation</option>
                <option value="Cars/Car-Infrastructure">Cars/Car-Infrastructure</option>
                <option value="Industry">Industry</option>
                <option value="Parks&Rec">Parks & Rec.</option>
            </select>
        </div>
        <div class="eingabefelder">
            <label class="form-label" for="temporary">Temporary</label>
            <input type="checkbox" class="form-control" id="temporary">
        </div>
        <div class="eingabefelder">
            <label for="formFile" class="form-label">Bild hochladen</label>
            <input class="form-control" type="file" id="formFile">
        </div>
        <button type="submit" class="button-submit">Save/Submit</button>
        <button type="button" class="button-cancel">Cancel</button>
    </form>
</div>
<hr>
<h3>Standort Bearbeiten</h3>
<div class="screen4">
    <form>
        <div class="eingabefelder">
            <label for="nameUpdate" class="form-label">Name/Title </label>
            <input type="text" class="form-control" id="nameUpdate" value="Baustelle"
                   required>
        </div>
        <div class="eingabefelder">
            <label for="descriptionUpdate" class="form-label">Description *</label>
            <textarea class="form-control" id="descriptionUpdate" required>Die Baustelle auf der Brückenstraße sollte eigentlich schon vor einem halben Jahre fertig sein. Leider sind dort kaum Fortschritte zu sehen. Dies führt du einem Umweg von mindestens 15 Minuten für die meisten Studierenden, die normalerweise von Schöneweide die Tram nehmen.
            </textarea>
        </div>
        <div class="eingabefelder">
            <label for="streetUpdate" class="form-label">Street & House No. *</label>
            <input type="text" class="form-control" id="streetUpdate" value="Brückenstraße 9" required>
        </div>
        <div class="eingabefelder">
            <label for="zipUpdate" class="form-label">ZIP *</label>
            <input type="text" class="form-control" id="zipUpdate" value="12459" required>
        </div>
        <div class="eingabefelder">
            <label for="cityUpdate" class="form-label">City *</label>
            <input type="text" class="form-control" id="cityUpdate" value="Berlin" required>
        </div>
        <div class="eingabefelder">
            <label for="categoryUpdate" class="form-label">Category *</label>
            <select class="form-select" id="categoryUpdate" required>
                <option value="Bike/Cyclists">Bike/Cyclists</option>
                <option value="Pedestrians">Pedestrians</option>
                <option selected="Public transportation">Public transportation</option>
                <option value="Cars/Car-Infrastructure">Cars/Car-Infrastructure</option>
                <option value="Industry">Industry</option>
                <option value="Parks&Rec">Parks & Rec.</option>
            </select>
        </div>
        <div class="eingabefelder">
            <label class="form-label" for="temporaryUpdate">Temporary</label>
            <input type="checkbox" class="form-control" id="temporaryUpdate">
        </div>
        <div class="eingabefelder">
            <label for="formFileUpdate" class="form-label">Bild hochladen</label>
            <input class="form-control" type="file" id="formFileUpdate">
        </div>
        <button type="submit" class="button-update">Update</button>
        <button type="button" class="button-delete">Delete</button>
        <button type="button" class="button-cancel">Cancel</button>
    </form>

    <aside>
        <img src="Baustelle_Vert.jpg" alt="Bild der Baustelle">
    </aside>
</div>
</body>
</html>
